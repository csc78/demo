<html>
<head>
<title>Animation</title>
<style>
.box{
width:100px;
height:100px;
background-color:red;
animation:move 3s infinite;
}
@keyframes move{
from{
transform:translateX(0);
}
to{
transform:translateX(400px);
}
}
</style>
</head>
<body>
<h1>Moving Box</h1>
<div class="box"></div>
</body>
</html>
